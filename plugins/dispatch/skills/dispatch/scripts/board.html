<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="refresh" content="5">
<title>Dispatch · 编排看板</title>
<style>
:root{color-scheme:light;--paper:#f6f5f0;--ink:#222d28;--muted:#66736a;--line:#d9dfd7;--green:#236448}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 "PingFang SC","Microsoft YaHei",sans-serif}main{max-width:1160px;margin:auto;padding:48px 32px 72px}header{border-top:4px solid var(--green);padding-top:24px;display:flex;justify-content:space-between;gap:24px;align-items:flex-end}h1{font-size:32px;font-weight:600;letter-spacing:-1px;margin:4px 0 0}.brand{font:12px/1.4 Menlo,Consolas,monospace;letter-spacing:3px;color:var(--green)}.refresh{font-size:12px;color:var(--muted);text-align:right}.refresh time{display:block;font-family:Menlo,Consolas,monospace;font-size:16px;color:var(--ink)}section{margin-top:36px}.section-head{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:12px;margin-bottom:18px;gap:12px}h2{font-size:17px;margin:0;font-weight:600}h2 b{margin-left:10px;font:15px Menlo,Consolas,monospace;color:var(--green)}.note{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.lane{background:#fff;border:1px solid var(--line);border-radius:6px;padding:22px;min-width:0}.lane.running{border-top:3px solid var(--green);padding-top:20px}.lane-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}h3{font-size:18px;margin:0;overflow-wrap:anywhere;min-width:0}.status{flex-shrink:0;color:var(--green);font-size:12px;background:#edf5ef;padding:2px 9px;border-radius:3px}.failed .status{color:#9c332d;background:#fff0eb}.aborted .status{color:#6d6449;background:#f5f0e4}.doing{margin:14px 0 20px;overflow-wrap:anywhere;min-height:24px}dl{margin:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr);gap:14px 20px}dl>div{min-width:0}dt{font-size:11px;color:var(--muted);margin-bottom:4px}dd{margin:0;font:13px/1.7 Menlo,Consolas,"PingFang SC",monospace;overflow-wrap:anywhere}.effort{display:inline-block;max-width:100%;background:#e5edb4;color:#33441c;border:1px solid #cbd890;border-radius:3px;padding:1px 10px;font-weight:700}.lane-bottom{border-top:1px solid #edf0eb;margin-top:20px;padding-top:12px;display:flex;justify-content:space-between;gap:14px;font-size:11px;color:var(--muted)}.cwd{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-family:Menlo,Consolas,monospace}.duration{flex-shrink:0;color:var(--ink);font-variant-numeric:tabular-nums}.empty{grid-column:1/-1;border:1px dashed var(--line);padding:32px;color:var(--muted);text-align:center;margin:0}footer{margin-top:32px;font-size:11px;color:var(--muted)}
@media(max-width:640px){main{padding:24px 16px 40px}header{gap:12px;align-items:flex-start}h1{font-size:27px}.brand{font-size:10px;letter-spacing:2px}.refresh{font-size:10px}.refresh time{font-size:13px}.grid{grid-template-columns:minmax(0,1fr)}.lane{padding:18px}.lane.running{padding-top:16px}.lane-bottom{gap:8px}section{margin-top:28px}.note{font-size:11px}}
</style>
</head>
<body><main>
<header><div><div class="brand">DISPATCH / LIVE</div><h1>编排看板</h1></div><div class="refresh">最近更新<time>{{TIME}}</time>每 5 秒刷新</div></header>
<section aria-labelledby="active-title"><div class="section-head"><h2 id="active-title">运行中<b>{{RUNNING_COUNT}}</b></h2></div><div class="grid">{{RUNNING}}</div></section>
<section aria-labelledby="ended-title"><div class="section-head"><h2 id="ended-title">最近结束<b>{{ENDED_COUNT}}</b></h2><span class="note">保留最近 20 条</span></div><div class="grid">{{ENDED}}</div></section>
<footer>DISPATCH · 编排车道</footer>
</main></body></html>
