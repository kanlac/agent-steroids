<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>编排看板</title>
<style>
:root{color-scheme:light;
  --page:#f2f4f6;--surface:#fff;--ink:#161a1f;--ink-2:#4b535d;--muted:#78818b;--grid:#e8ebee;--axis:#c4cad1;--hair:rgba(22,26,31,.09);--hover:#f6f8fa;
  --run:#2a78d6;--ok:#13865f;--fail:#d03b3b;--abort:#8f99a3;--warn:#9a5600;--warn-mark:#e3a234;--warn-bg:#fff3dc;--fail-text:#b42d2a;
  /* effort: one-hue ordinal ramp, minimal → max */
  --e0:#c4cad1;--e1:#aa98ff;--e2:#9481e8;--e3:#7e6acf;--e4:#6953b6;--e5:#543d9e;--e6:#412686;
  font:14px/1.5 system-ui,-apple-system,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);-webkit-text-size-adjust:100%}
main{max-width:1200px;margin:0 auto;padding:28px 32px 40px}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:6px 16px;flex-wrap:wrap}
h1{margin:0;font-size:22px;font-weight:650;letter-spacing:-.01em}
.sync{margin:0;min-height:20px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.sync.late{color:var(--warn);font-weight:600}

.summary{display:flex;flex-wrap:wrap;align-items:stretch;gap:16px 40px;margin:18px 0 20px}
.stats{display:flex;gap:0}
.stat{padding:0 22px;border-left:1px solid var(--axis);display:flex;flex-direction:column;gap:2px}
.stat:first-child{padding-left:0;border-left:0}
.stat b{font-size:28px;line-height:1.1;font-weight:650}
.stat span{display:flex;align-items:center;gap:6px;color:var(--ink-2);font-size:13px;white-space:nowrap}
.stat.zero b{color:var(--muted);font-weight:500}
.stat.warn b,.stat.warn span{color:var(--warn)}
.stat.bad b,.stat.bad span{color:var(--fail-text)}
.split{flex:1;min-width:240px;max-width:460px;display:flex;flex-direction:column;justify-content:center;gap:8px}
.split h2{margin:0;font-size:13px;font-weight:500;color:var(--ink-2)}
.splitbar{display:flex;gap:2px;height:12px}
.splitbar i{border-radius:3px;min-width:6px}
.legend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:13px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:2px}
.legend b{color:var(--ink);font-weight:600}
.split .none{margin:0;color:var(--muted);font-size:13px}

.g{display:inline-flex;justify-content:center;align-items:center;width:14px;flex:none;font-style:normal;font-weight:700;font-size:13px;line-height:1}
.g.running::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--run)}
.g.ok{color:var(--ok)}.g.ok::before{content:"✓"}
.g.failed{color:var(--fail)}.g.failed::before{content:"✕"}
.g.aborted{color:var(--abort)}.g.aborted::before{content:"⊘"}
.g.stale{color:var(--warn-mark)}.g.stale::before{content:"⚠"}

.board{background:var(--surface);border:1px solid var(--hair);border-radius:12px;padding:0 20px 8px}
body.late .summary,body.late .lanes{opacity:.5}
.cols{display:grid;grid-template-columns:minmax(0,1fr) 104px minmax(0,1.9fr) 72px;grid-template-areas:"who eff track time";column-gap:20px}
.who{grid-area:who}.eff{grid-area:eff}.track{grid-area:track;position:relative}.time{grid-area:time}
.axis{position:sticky;top:0;z-index:2;background:var(--surface);height:42px;align-items:end;border-bottom:1px solid var(--axis);font-size:12px;color:var(--muted);border-radius:12px 12px 0 0}
.axis>span:not(.track){padding-bottom:8px}.axis .time{text-align:right}
.axis .track{height:100%}
.tick{position:absolute;bottom:8px;transform:translateX(-50%);white-space:nowrap;font-variant-numeric:tabular-nums}
.tick.first{transform:none}
.nowtag{position:absolute;bottom:7px;transform:translateX(-100%);padding-right:6px;color:var(--run);font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.group{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:18px 0 6px}
.group h2{margin:0;font-size:13px;font-weight:600;color:var(--ink-2)}
.group h2 b{margin-left:2px;color:var(--ink)}
.group p{margin:0;font-size:12px;color:var(--muted)}
.empty{margin:0;padding:14px 0 18px;color:var(--muted);border-top:1px solid var(--grid)}

.lane{border-top:1px solid var(--grid)}
.row{appearance:none;border:0;background:none;font:inherit;color:inherit;text-align:left;width:calc(100% + 40px);margin:0 -20px;padding:0 20px;cursor:pointer;align-items:center}
.row:hover,.lane.open .row{background:var(--hover)}
.row:focus-visible{outline:2px solid var(--run);outline-offset:-2px;border-radius:6px}
.who{display:grid;grid-template-columns:auto minmax(0,1fr);grid-template-areas:"name tools" "doing doing" "quiet quiet";align-items:baseline;gap:1px 10px;padding:10px 0;min-width:0}
.name{grid-area:name;display:flex;align-items:baseline;gap:6px;min-width:0;max-width:100%;font-weight:600}
.name .g{align-self:center;margin-right:-2px}
.name b{font-weight:600;overflow-wrap:anywhere}
.word{flex:none;font-weight:500;font-size:12px;color:var(--ink-2)}
.doing{grid-area:doing;padding-left:20px;color:var(--ink);overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tools{grid-area:tools;display:flex;gap:10px;min-width:0;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden}
.tools span{overflow:hidden;text-overflow:ellipsis;min-width:0}
.quiet{grid-area:quiet;justify-self:start;margin-left:20px;font-size:12px;color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:4px;padding:0 6px;border-radius:4px;background:var(--warn-bg);color:var(--warn);font-weight:600}
.eff{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2);min-width:0}
.eff span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pips{display:inline-flex;align-items:flex-end;gap:2px;height:16px;flex:none}
.pips i{width:4px;border-radius:1px;background:var(--grid)}
.time{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;white-space:nowrap}
.lane:not(.running) .time{font-weight:500;color:var(--ink-2)}
.row .track{align-self:stretch;min-height:44px}
.gl,.nowline{position:absolute;top:0;bottom:0;width:1px;background:var(--grid)}
.nowline{background:var(--run);width:2px;margin-left:-1px;opacity:.7}
.bar{position:absolute;top:50%;height:10px;margin-top:-5px;border-radius:3px;min-width:3px}
.bar.running{background:var(--run);border-radius:3px 0 0 3px}
.bar.ok{background:var(--ok)}
.bar.failed{background:var(--fail)}
.bar.aborted{background:repeating-linear-gradient(135deg,var(--abort) 0 2px,#fff 2px 5px);box-shadow:inset 0 0 0 1px var(--abort)}
.bar.tail{background:repeating-linear-gradient(135deg,var(--warn-mark) 0 2px,#fff 2px 5px);border-radius:0;height:6px;margin-top:-3px}
.bar.cut{border-top-left-radius:0;border-bottom-left-radius:0}
.head{position:absolute;top:50%;width:10px;height:10px;margin:-5px 0 0 -5px;border-radius:50%;background:var(--run);box-shadow:0 0 0 2px var(--surface)}
.head::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--run);opacity:0;animation:pulse 2s ease-out infinite;animation-delay:inherit}
.lane.stale .head{background:var(--warn-mark)}.lane.stale .head::after{display:none}
@keyframes pulse{0%{transform:scale(.5);opacity:.6}100%{transform:scale(1.4);opacity:0}}
@media (prefers-reduced-motion:reduce){.head::after{animation:none}}

.detail{margin:0 -20px;padding:4px 20px 16px 40px;background:var(--hover)}
.detail dl{margin:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px 24px}
.detail dl>div{min-width:0}.detail .wide{grid-column:1/-1}
.detail dt{font-size:12px;color:var(--muted)}
.detail dd{margin:0;overflow-wrap:anywhere}
.detail .mono dd{font:12.5px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--ink-2)}
.tip{position:fixed;z-index:9;pointer-events:none;max-width:300px;padding:10px 12px;border-radius:8px;background:var(--surface);border:1px solid var(--hair);box-shadow:0 6px 24px rgba(22,26,31,.12);font-size:13px}
.tip b{display:block;font-size:15px;font-variant-numeric:tabular-nums}
.tip p{margin:2px 0 0;color:var(--ink-2)}
.foot{margin:14px 0 0;font-size:12px;color:var(--muted)}

@media (max-width:720px){
  main{padding:18px 12px 32px}
  h1{font-size:20px}
  .sync{flex-basis:100%}
  .summary{gap:16px;margin:14px 0 16px}
  .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 0;width:100%}
  .stat,.stat:first-child{padding:0 12px;border-left:1px solid var(--axis)}
  .stat:nth-child(3n+1){padding-left:0;border-left:0}
  .stat b{font-size:24px}
  .split{max-width:none}
  .board{padding:0 12px 6px;border-radius:10px}
  .cols{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"who time" "who eff" "track track";column-gap:12px}
  .axis{grid-template-columns:1fr;grid-template-areas:"track";height:34px}
  .axis>span:not(.track){display:none}
  .row{width:calc(100% + 24px);margin:0 -12px;padding:0 12px 10px}
  .row .who{padding:10px 0 4px}
  .row .time{align-self:end}.row .eff{align-self:start;justify-content:flex-end}
  .eff span{max-width:72px}
  .row .track{min-height:16px}
  .who{grid-template-columns:minmax(0,1fr);grid-template-areas:"name" "doing" "tools" "quiet"}
  .tools{padding-left:20px;flex-wrap:wrap;gap:0 10px;white-space:normal}
  .tools span{overflow-wrap:anywhere}
  .detail{margin:0 -12px;padding:2px 12px 14px 32px}
  .detail dl{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
}
</style>
</head>
<body>
<main>
<header class="top"><h1>编排看板</h1><p class="sync" id="sync" role="status"></p></header>
<section class="summary" id="summary" aria-label="概览"></section>
<section class="board" id="board" aria-label="车道时间线"></section>
<p class="foot" id="foot"></p>
<noscript><p>时间线需要启用 JavaScript 才能显示。</p></noscript>
</main>
<div class="tip" id="tip" hidden></div>
<script type="application/json" id="board-data">{{DATA}}</script>
<script>
"use strict";
const LEVELS = ["minimal", "low", "medium", "high", "xhigh", "max"]; // pips = index + 1; none or unknown = 0
const STATUS = {running: "运行中", ok: "完成", failed: "失败", aborted: "中止"};
const STALE_MS = 10 * 60e3, POLL_MS = 5e3, LATE_MS = 15e3;
const STEPS = [5, 10, 15, 30, 60, 120, 180, 360, 720].map(m => m * 60e3);
const $ = id => document.getElementById(id);
const el = {sync: $("sync"), summary: $("summary"), board: $("board"), foot: $("foot"), tip: $("tip")};
const opened = new Set();
let data, skew = 0, syncedAt = Date.now(), tipId = null, pollTimer = 0;

// Every user-supplied string goes in as a text node or attribute value, never as HTML.
function h(tag, props, ...kids) {
  const node = document.createElement(tag);
  for (const [key, value] of Object.entries(props || {})) {
    if (value == null || value === false) continue;
    if (key === "style") Object.assign(node.style, value);
    else node.setAttribute(key === "cls" ? "class" : key, value);
  }
  node.append(...kids.flat(Infinity).filter(kid => kid != null && kid !== false));
  return node;
}
const now = () => Date.now() + skew;
const clamp = v => Math.min(100, Math.max(0, v));
const pad = n => String(n).padStart(2, "0");
const clock = (t, sec) => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}` + (sec ? `:${pad(d.getSeconds())}` : ""); };
function dur(ms) {
  const s = Math.max(0, Math.floor(ms / 1000)), hh = Math.floor(s / 3600), mm = Math.floor(s % 3600 / 60);
  return hh ? `${hh}h ${pad(mm)}m` : mm ? `${mm}m ${pad(s % 60)}s` : `${s}s`;
}
function ago(ms) {
  const m = Math.floor(ms / 60e3);
  return m < 1 ? "刚刚" : m < 60 ? `${m} 分钟前` : `${Math.floor(m / 60)} 小时 ${m % 60} 分钟前`;
}

function view(lane, t) {
  const start = Date.parse(lane.started_at), upd = Date.parse(lane.updated_at);
  const end = lane.ended_at ? Date.parse(lane.ended_at) : null;
  return {...lane, start, upd, end, quiet: t - upd, elapsed: (end ?? t) - start,
    stale: lane.status === "running" && t - upd > STALE_MS,
    level: LEVELS.indexOf(String(lane.effort).toLowerCase()) + 1};
}

// Axis: from the earliest lane worth showing (running, or ended in the last 8 h) to now; 30 min to 24 h.
function domain(lanes, t) {
  const shown = lanes.filter(l => !l.end || l.end > t - 8 * 3600e3).map(l => l.start);
  const t0 = Math.max(Math.min(t - 30 * 60e3, ...shown), t - 24 * 3600e3);
  return [t0 - (t - t0) * 0.03, t + (t - t0) * 0.012];
}
function ticks([t0, t1], width) {
  const want = Math.max(2, Math.floor(width / 72));
  const step = STEPS.find(s => (t1 - t0) / s <= want) || STEPS[STEPS.length - 1];
  const off = new Date(t1).getTimezoneOffset() * 60e3, out = [];
  for (let t = Math.ceil((t0 - off) / step) * step + off; t < t1; t += step) out.push(t);
  return out;
}

const glyph = status => h("i", {cls: "g " + status, "aria-hidden": "true"});
function pips(level) {
  return h("span", {cls: "pips", "aria-hidden": "true"}, LEVELS.map((_, i) =>
    h("i", {style: {height: 6 + i * 2 + "px", background: i < level ? `var(--e${level})` : ""}})));
}
function stat(value, label, status, warn) {
  return h("div", {cls: "stat " + (value ? warn || "" : "zero")},
    h("b", null, String(value)), h("span", null, glyph(status), label));
}

function summary(lanes, t) {
  const midnight = new Date(t).setHours(0, 0, 0, 0);
  const count = status => lanes.filter(l => l.status === status && l.end >= midnight).length;
  const running = lanes.filter(l => l.status === "running");
  const groups = new Map();
  for (const l of [...running].sort((a, b) => a.level - b.level)) {
    const key = String(l.effort);
    groups.set(key, {level: l.level, n: (groups.get(key)?.n || 0) + 1});
  }
  const parts = [...groups];
  return [
    h("div", {cls: "stats"},
      stat(running.length, "运行中", "running"), stat(count("ok"), "今天完成", "ok"),
      stat(count("failed"), "今天失败", "failed", "bad"), stat(count("aborted"), "今天中止", "aborted"),
      stat(running.filter(l => l.stale).length, "超 10 分钟无更新", "stale", "warn")),
    h("div", {cls: "split"}, h("h2", null, "运行中车道的推理强度"),
      parts.length ? [
        h("div", {cls: "splitbar", role: "img", "aria-label": parts.map(([k, g]) => `${k} ${g.n}`).join("，")},
          parts.map(([k, g]) => h("i", {title: `${k}：${g.n}`, style: {flexGrow: g.n, background: `var(--e${g.level})`}}))),
        h("div", {cls: "legend"}, parts.map(([k, g]) =>
          h("span", null, h("i", {style: {background: `var(--e${g.level})`}}), k, h("b", null, String(g.n)))))
      ] : h("p", {cls: "none"}, "没有运行中的车道"))
  ];
}

function axisRow(dom, x, list, t, width) {
  const nx = x(t), labels = list.filter(v => (nx - x(v)) / 100 * width > 100);
  return h("div", {cls: "cols axis", "aria-hidden": "true"},
    h("span", {cls: "who"}, "车道"), h("span", {cls: "eff"}, "推理强度"),
    h("span", {cls: "track"},
      labels.map(v => h("span", {cls: "tick" + (x(v) < 4 ? " first" : ""), style: {left: x(v) + "%"}}, clock(v))),
      h("span", {cls: "nowtag", style: {left: nx + "%"}}, "现在 " + clock(t))),
    h("span", {cls: "time"}, "时长"));
}

function details(l, t) {
  const item = (label, value, cls) => value == null ? null :
    h("div", {cls}, h("dt", null, label), h("dd", null, String(value)));
  return h("dl", null,
    item("在做", l.doing, "wide"),
    item("状态", STATUS[l.status] || l.status), item("工具", l.tool), item("模型", l.model), item("推理强度", l.effort),
    item("开始", clock(l.start, true)),
    l.end ? item("结束", `${clock(l.end, true)}（${ago(t - l.end)}）`) : item("最后更新", `${clock(l.upd, true)}（${ago(l.quiet)}）`),
    item(l.end ? "用时" : "已运行", dur(l.elapsed)), item("PID", l.pid),
    item("工作目录", l.cwd, "wide mono"), item("任务目录", l.task_dir, "wide mono"), item("车道 ID", l.id, "wide mono"));
}

function laneRow(l, x, list, t) {
  const open = opened.has(l.id), x0 = x(l.start), x1 = x(l.end ?? t), cut = x0 === 0;
  const bar = (cls, a, b) => h("span", {cls: `bar ${cls}` + (cut && a === x0 ? " cut" : ""), style: {left: a + "%", width: Math.max(0, b - a) + "%"}});
  const marks = l.stale
    ? [bar("running", x0, x(l.upd)), bar("tail", x(l.upd), x1)]
    : [bar(l.status, x0, x1)];
  if (l.status === "running") marks.push(h("span", {cls: "head", style: {left: x1 + "%", animationDelay: -(Date.now() % 2000) + "ms"}}));
  const quiet = l.stale ? h("span", {cls: "quiet chip"}, `⚠ ${Math.floor(l.quiet / 60e3)} 分钟没有更新`)
    : l.status === "running" && l.quiet >= 60e3 && h("span", {cls: "quiet"}, "更新于 " + ago(l.quiet));
  return h("div", {cls: `lane ${l.status}` + (l.stale ? " stale" : "") + (open ? " open" : "")},
    h("button", {cls: "cols row", type: "button", "data-id": l.id, "aria-expanded": String(open)},
      h("span", {cls: "who"},
        h("span", {cls: "name"}, glyph(l.status), h("b", null, l.name),
          l.status !== "running" && h("span", {cls: "word"}, STATUS[l.status] || l.status)),
        h("span", {cls: "tools"}, h("span", null, l.tool), h("span", null, l.model)),
        h("span", {cls: "doing"}, l.doing), quiet),
      h("span", {cls: "eff", title: "推理强度"}, pips(l.level), h("span", null, l.effort)),
      h("span", {cls: "track", "data-id": l.id}, list.map(v => h("span", {cls: "gl", style: {left: x(v) + "%"}})),
        h("span", {cls: "nowline", style: {left: x(t) + "%"}}), marks),
      h("span", {cls: "time"}, dur(l.elapsed))),
    open && h("div", {cls: "detail"}, details(l, t)));
}

function group(title, lanes, note, rows) {
  return [h("div", {cls: "group"}, h("h2", null, title + " ", h("b", null, String(lanes.length))), note && h("p", null, note)),
    lanes.length ? rows : h("p", {cls: "empty"}, title === "运行中" ? "没有运行中的车道" : "还没有结束的车道")];
}

function draw() {
  const t = now(), lanes = [...data.running, ...data.ended].map(l => view(l, t));
  el.summary.replaceChildren(...summary(lanes, t));
  el.foot.textContent = `已结束的车道只保留最近 ${data.history_limit} 条，今天的计数按这些记录统计。点一条车道可展开详情。`;
  if (!lanes.length) {
    el.board.replaceChildren(h("p", {cls: "empty"}, "还没有车道。用 dispatch.py run 派活，或用 start 登记车道后，它会出现在这里。"));
    return syncText();
  }
  const dom = domain(lanes, t), x = v => clamp((v - dom[0]) / (dom[1] - dom[0]) * 100);
  const width = el.board.querySelector(".axis .track")?.clientWidth || el.board.clientWidth * (innerWidth > 720 ? 0.5 : 1);
  const list = ticks(dom, width), rows = ls => ls.map(l => laneRow(l, x, list, t));
  const running = lanes.filter(l => l.status === "running"), ended = lanes.filter(l => l.status !== "running");
  const focused = document.activeElement?.closest?.(".row")?.dataset.id;
  el.board.replaceChildren(axisRow(dom, x, list, t, width), h("div", {cls: "lanes"},
    group("运行中", running, null, rows(running)),
    group("最近结束", ended, `只保留最近 ${data.history_limit} 条`, rows(ended))));
  if (focused) el.board.querySelector(`.row[data-id="${CSS.escape(focused)}"]`)?.focus({preventScroll: true});
  syncText();
  if (tipId) fillTip(tipId);
}

function syncText() {
  const age = Date.now() - syncedAt, late = age > LATE_MS;
  el.sync.className = "sync" + (late ? " late" : "");
  el.sync.textContent = late
    ? `⚠ 已 ${Math.round(age / 1000)} 秒没连上看板服务，下面是 ${clock(syncedAt, true)} 的状态`
    : `已同步 ${clock(syncedAt, true)}，每 5 秒刷新`;
  document.body.classList.toggle("late", late);
}

function fillTip(id) {
  const t = now(), raw = [...data.running, ...data.ended].find(l => l.id === id);
  if (!raw) return hideTip();
  const l = view(raw, t);
  el.tip.replaceChildren(h("b", null, dur(l.elapsed)),
    h("p", null, `${l.name}，${STATUS[l.status] || l.status}`),
    h("p", null, `${clock(l.start)} → ${l.end ? clock(l.end) : "现在"}`),
    h("p", null, l.end ? `结束于 ${ago(t - l.end)}` : `最后更新 ${ago(l.quiet)}`));
}
function hideTip() { tipId = null; el.tip.hidden = true; }
el.board.addEventListener("pointermove", e => {
  const track = e.pointerType === "mouse" && e.target.closest(".row .track");
  if (!track) return hideTip();
  if (tipId !== track.dataset.id) { tipId = track.dataset.id; fillTip(tipId); }
  el.tip.hidden = false;
  const r = el.tip.getBoundingClientRect();
  el.tip.style.left = Math.min(e.clientX + 14, innerWidth - r.width - 8) + "px";
  el.tip.style.top = (e.clientY + 18 + r.height > innerHeight ? e.clientY - r.height - 12 : e.clientY + 18) + "px";
});
el.board.addEventListener("pointerleave", hideTip);
el.board.addEventListener("click", e => {
  const row = e.target.closest(".row");
  if (!row) return;
  const id = row.dataset.id;
  opened.has(id) ? opened.delete(id) : opened.add(id);
  draw();
});

function load(payload) {
  data = payload;
  skew = payload.now * 1000 - Date.now();
  syncedAt = Date.now();
  draw();
}
// Pull the same page in the background and redraw in place: no reload, no flash, open rows stay open.
async function poll() {
  if (!document.hidden) {
    try {
      const res = await fetch(location.pathname, {cache: "no-store"});
      if (!res.ok) throw new Error(String(res.status));
      const doc = new DOMParser().parseFromString(await res.text(), "text/html");
      load(JSON.parse(doc.getElementById("board-data").textContent));
    } catch (_) { syncText(); }
  }
  clearTimeout(pollTimer);
  pollTimer = setTimeout(poll, POLL_MS);
}
let resizeFrame = 0;
addEventListener("resize", () => { cancelAnimationFrame(resizeFrame); resizeFrame = requestAnimationFrame(draw); });
document.addEventListener("visibilitychange", () => { if (!document.hidden) { clearTimeout(pollTimer); poll(); } });
setInterval(syncText, 1000);
load(JSON.parse($("board-data").textContent));
draw();
pollTimer = setTimeout(poll, POLL_MS);
</script>
</body>
</html>
