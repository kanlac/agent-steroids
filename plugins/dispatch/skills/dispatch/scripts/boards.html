<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="5"><title>编排看板</title>
<link rel="icon" type="image/svg+xml" href="{{FAVICON}}">
<style>
:root{color-scheme:light;--e6:#412686;--e1:#aa98ff;font:14px/1.6 system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;color:#161a1f;background:#f2f4f6}*{box-sizing:border-box}body{margin:0}main{max-width:1100px;margin:0 auto;padding:32px}header{margin-bottom:24px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}.brand{display:flex;align-items:center;gap:10px;min-width:0}.board-logo{flex:none;width:28px;height:28px}h1{font-size:24px;margin:0}header span,.muted{color:#78818b;font-size:12px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card{display:block;min-width:0;padding:20px;border:1px solid #e2e6eb;border-radius:10px;background:#fff;color:inherit;text-decoration:none}.card:hover{border-color:#2a78d6}.card:focus-visible{outline:2px solid #2a78d6}h2{font:600 18px/1.4 ui-monospace,Menlo,Consolas,monospace;color:#2a78d6;margin:0 0 16px;overflow-wrap:anywhere}p{margin:5px 0;overflow-wrap:anywhere}b{font-size:23px}@media(max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}main{padding:24px 16px}}
</style></head><body><main><header><div class="brand">{{LOGO}}<h1>编排看板</h1></div><span>每 5 秒刷新</span></header><section class="grid" aria-label="所有看板">{{BOARDS}}</section></main></body></html>
