      grid-template-columns: 26px minmax(0, 1fr) auto;
      gap: 10px;
      align-items: center;
      padding: 9px 10px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .34);
      font-size: 13px;
      line-height: 1.25;
      overflow-wrap: anywhere;
    }

    .severity-step::before {
      content: "";
      width: 12px;
      aspect-ratio: 1;
      border-radius: 999px;
      border: 2px solid var(--line-strong);
      background: var(--paper);
    }

    .severity-step.current {
      border-color: var(--red);
      background: rgba(180, 34, 43, .10);
      color: var(--red-deep);
      font-weight: 900;
    }

    .severity-step.current::before {
      border-color: var(--red);
      background: var(--red);
      box-shadow: 0 0 0 5px rgba(180, 34, 43, .12);
    }

    .severity-code {
      font-family: var(--utility);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .mini-findings {
      padding: 0;
      overflow: hidden;
    }

    .mini-row {
      display: grid;
      grid-template-columns: 118px minmax(0, 1fr);
      border-bottom: 1px solid var(--line);
    }

    .mini-row:last-child { border-bottom: 0; }

    .mini-row b,
    .mini-row span {
      padding: 12px 14px;
      min-width: 0;
    }

    .mini-row b {
      color: #fff;
      background: var(--blue-deep);
      font-size: 13px;
      letter-spacing: .08em;
    }

    .mini-row span {
      font-size: 14px;
      line-height: 1.45;
    }

    main {
      display: grid;
      gap: 26px;
      padding: clamp(20px, 4vw, 42px);
    }

    .section {
      border: 2px solid var(--line-strong);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, .50), rgba(255, 255, 255, .18)),
        rgba(244, 246, 237, .84);
    }

    .section-header {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr) auto;
      gap: 14px;
      align-items: center;
      padding: 14px 16px;
      border-bottom: 2px solid var(--line-strong);
      background: rgba(229, 240, 232, .72);
    }

    .section-tag {
      padding: 6px 8px;
      color: #fff;
      background: var(--ink);
      font-family: var(--utility);
      font-size: 12px;
      font-weight: 900;
      letter-spacing: .08em;
    }

    .section h2 {
      margin: 0;
      font-family: var(--display);
      font-size: clamp(24px, 3vw, 38px);
      line-height: 1.1;
      letter-spacing: 0;
    }

    .section-caption {
      color: var(--ink-muted);
      font-size: 13px;
      font-weight: 800;
      text-align: right;
    }

    .section-body {
      padding: clamp(16px, 3vw, 26px);
    }

    .memory-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .memory-card {
      min-width: 0;
      border: 2px solid var(--ink);
      background: rgba(255, 255, 255, .36);
    }

    .memory-card.preset { border-color: var(--red-deep); }
    .memory-card.external { border-color: var(--green); }

    .memory-top {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: end;
      padding: 18px;
      border-bottom: 1px solid var(--line-strong);
    }

    .memory-top h3 {
      margin: 0;
      font-family: var(--display);
      font-size: 28px;
      line-height: 1.1;
    }

    .memory-top p {
      margin: 6px 0 0;
      color: var(--ink-muted);
      font-size: 13px;
      font-weight: 800;
    }

    .memory-score {
      color: var(--red-deep);
      font-family: var(--display);
      font-size: 62px;
      font-weight: 900;
      line-height: .82;
    }

    .memory-card.external .memory-score { color: var(--green); }

    .surface-list {
      display: grid;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .surface-list li {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 52px;
      gap: 12px;
      align-items: center;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
    }

    .surface-list li:last-child { border-bottom: 0; }

    .surface-name {
      min-width: 0;
      font-weight: 900;
      line-height: 1.35;
    }

    code,
    .code {
      font-family: var(--utility);
      font-size: .92em;
      overflow-wrap: anywhere;
    }

    .surface-note {
      display: block;
      margin-top: 4px;
      color: var(--ink-muted);
      font-size: 12px;
      font-weight: 700;
    }

    .surface-score {
      display: grid;
      place-items: center;
      min-width: 44px;
      aspect-ratio: 1;
      color: #fff;
      background: var(--ink);
      font-family: var(--utility);
      font-size: 15px;
      font-weight: 900;
    }

    .diagnostic-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
    }

    .finding-card {
      min-width: 0;
      border: 2px solid var(--line-strong);
      background: rgba(255, 255, 255, .36);
    }

    .finding-head {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      padding: 15px 16px;
      border-bottom: 1px solid var(--line-strong);
      background: rgba(255, 255, 255, .38);
    }

    .finding-head h3 {
      margin: 0;
      font-family: var(--display);
      font-size: 25px;
      line-height: 1.08;
    }

    .finding-score {
      display: grid;
      place-items: center;
      width: 78px;
      aspect-ratio: 1;
      border: 3px solid currentColor;
      font-family: var(--display);
      font-size: 32px;
      font-weight: 900;
      line-height: 1;
      transform: rotate(2deg);
    }

    .danger { color: var(--red-deep); }
    .warn { color: var(--orange); }
    .caution { color: #9b780d; }
    .healthy { color: var(--green); }

    .score-number.healthy,
    .memory-score.healthy {
      color: var(--green);
    }

    .surface-score.healthy { background: var(--green); }
    .surface-score.caution {
      color: var(--ink);
      background: var(--yellow);
    }
    .surface-score.warn {
      color: #fff;
      background: var(--orange);
    }
    .surface-score.danger {
      color: #fff;
      background: var(--red-deep);
    }

    .severity-step.current.clear,
    .severity-step.current.load {
      border-color: var(--green);
      background: rgba(71, 121, 106, .12);
      color: var(--green);
    }

    .severity-step.current.clear::before,
    .severity-step.current.load::before {
      border-color: var(--green);
      background: var(--green);
      box-shadow: 0 0 0 5px rgba(71, 121, 106, .14);
    }

    .finding-tagline {
      margin: 8px 0 0;
      color: var(--ink-muted);
      font-size: 13px;
      font-weight: 800;
    }

    .evidence-list {
      display: grid;
      gap: 10px;
      margin: 0;
      padding: 14px;
      list-style: none;
    }

    .evidence {
      display: grid;
      gap: 6px;
      padding: 11px 12px;
      border-left: 5px solid var(--blue);
      background: rgba(229, 240, 232, .70);
    }

    .evidence strong {
      font-family: var(--utility);
      font-size: 12px;
      overflow-wrap: anywhere;
    }

    .evidence span {
      font-size: 14px;
      line-height: 1.48;
      overflow-wrap: anywhere;
    }

    .vs-list {
      display: grid;
      gap: 18px;
    }

    .conflict-card {
      overflow: hidden;
      border: 2px solid var(--ink);
      background: rgba(255, 255, 255, .38);
    }

    .conflict-diagnosis {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      padding: 10px 12px;
      border-bottom: 1px solid var(--line-strong);
      background: rgba(251, 244, 220, .78);
      color: var(--ink-muted);
      font-size: 12px;
      font-weight: 900;
      line-height: 1.35;
    }

    .conflict-diagnosis b {
      color: var(--red-deep);
      font-family: var(--utility);
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .split-diff {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      align-items: stretch;
    }

    .diff-panel {
      min-width: 0;
      border-right: 1px solid var(--line-strong);
      background: rgba(255, 255, 255, .30);
    }

    .diff-panel:last-child {
      border-right: 0;
    }

    .diff-path {
      display: grid;
      grid-template-columns: auto minmax(0, 1fr);
      gap: 8px;
      align-items: center;
      padding: 9px 10px;
      border-bottom: 1px solid var(--line-strong);
      background: rgba(24, 33, 31, .88);
      color: #fff;
      font-family: var(--utility);
      font-size: 12px;
      font-weight: 900;
      line-height: 1.3;
    }

    .diff-path span:last-child {
      overflow-wrap: anywhere;
    }

    .diff-badge {
      display: inline-grid;
      place-items: center;
      min-width: 24px;
      height: 24px;
      border: 1px solid rgba(255, 255, 255, .42);
      color: #fff;
      font-weight: 900;
    }

    .diff-row {
      display: grid;
      grid-template-columns: 54px minmax(0, 1fr);
      min-height: 72px;
      font-family: var(--utility);
      font-size: 13px;
      line-height: 1.55;
    }

    .diff-gutter {
      display: grid;
      place-items: start end;
      padding: 13px 10px;
      border-right: 1px solid var(--line);
      color: var(--ink-muted);
      background: rgba(24, 33, 31, .055);
      user-select: none;
    }

    .diff-code {
      display: grid;
      align-items: start;
      padding: 13px 12px;
      overflow-wrap: anywhere;
      font-weight: 800;
    }

    .diff-code del,
    .diff-code ins {
      text-decoration: none;
    }

    .diff-panel.old .diff-code {
      border-left: 5px solid rgba(180, 34, 43, .74);
      background: rgba(180, 34, 43, .105);
    }

    .diff-panel.new .diff-code {
      border-left: 5px solid rgba(71, 121, 106, .78);
      background: rgba(71, 121, 106, .12);
    }

    .diff-panel.old .diff-badge { background: var(--red-deep); }
    .diff-panel.new .diff-badge { background: var(--green); }

    .confidence {
      display: inline-block;
      padding: 4px 7px;
      color: #fff;
      background: var(--violet);
      font-size: 12px;
      font-weight: 900;
    }

    .prescription-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .prescription-preview {
      border: 2px solid var(--ink);
      background:
        linear-gradient(0deg, transparent 0 31px, rgba(180, 34, 43, .10) 32px, transparent 33px) 0 0 / 100% 33px,
        rgba(255, 255, 255, .38);
    }

    .rx-pad {
      min-width: 0;
      border: 2px solid var(--ink);
      background:
        linear-gradient(0deg, transparent 0 31px, rgba(180, 34, 43, .10) 32px, transparent 33px) 0 0 / 100% 33px,
        rgba(255, 255, 255, .38);
    }

    .rx-pad h3 {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin: 0;
      padding: 16px;
      color: #fff;
      background: var(--ink);
      font-family: var(--display);
      font-size: 26px;
      line-height: 1.1;
    }

    .rx-pad.herbal h3 { background: var(--green); }

    .rx-list {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 14px;
      list-style: none;
    }

    .rx-item {
      padding: 14px;
      border: 1px solid var(--line-strong);
      background: rgba(244, 246, 237, .78);
    }

    .rx-name {
      margin: 0 0 11px;
      font-size: 15px;
      font-weight: 900;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .rx-focus .rx-name {
      margin-bottom: 6px;
      font-size: clamp(16px, 2vw, 19px);
    }

    .rx-reason {
      margin: 0;
      color: var(--ink-muted);
      font-size: 14px;
      font-weight: 800;
      line-height: 1.55;
      overflow-wrap: anywhere;
    }

    .rx-footnote {
      margin: 0;
      padding: 0 14px 16px;
      color: var(--ink-muted);
      font-size: 13px;
      font-weight: 900;
      line-height: 1.4;
    }

    .rx-meta {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .rx-meta span {
      min-width: 0;
      padding: 7px;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, .56);
      font-size: 12px;
      font-weight: 900;
      line-height: 1.3;
    }

    .rx-meta b {
      display: block;
      color: var(--ink-muted);
      font-family: var(--utility);
      font-size: 10px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .treatment-cta {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 18px;
      align-items: center;
      margin-top: 18px;
      padding: clamp(16px, 3vw, 24px);
      border: 3px solid var(--red);
      background:
        linear-gradient(135deg, rgba(180, 34, 43, .12), transparent 48%),
        rgba(251, 244, 220, .82);
      box-shadow: inset 0 0 0 2px rgba(180, 34, 43, .16);
    }

    .treatment-cta p {
      margin: 0;
      font-size: clamp(16px, 2vw, 20px);
      font-weight: 900;
      line-height: 1.45;
    }

    .treatment-cta span {
      display: block;
      margin-top: 4px;
      color: var(--ink-muted);
      font-size: 13px;
      font-weight: 800;
    }

    .treatment-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      padding: 13px 18px;
      border: 2px solid var(--red-deep);
      color: #fff;
      background: var(--red);
      font-family: var(--display);
      font-size: 18px;
      font-weight: 900;
      text-decoration: none;
      white-space: nowrap;
      box-shadow: 6px 6px 0 rgba(127, 21, 30, .18);
    }

    .share-panel {
      padding: 16px;
      border-color: var(--red-deep);
      background:
        linear-gradient(135deg, rgba(180, 34, 43, .14), transparent 48%),
        rgba(251, 244, 220, .78);
    }

    .share-button {
      width: 100%;
      min-height: 54px;
      border: 2px solid var(--red-deep);
      color: #fff;
      background: var(--red);
      font-family: var(--display);
      font-size: 22px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 7px 7px 0 rgba(127, 21, 30, .18);
    }

    .share-button:hover {
      background: var(--red-deep);
    }

    .share-note {
      margin: 10px 0 0;
      color: var(--ink-muted);
      font-size: 12px;
      font-weight: 900;
      line-height: 1.45;
    }

    .prognosis {
      display: grid;
      grid-template-columns: minmax(260px, .75fr) minmax(0, 1.25fr);
      gap: 20px;
      align-items: stretch;
    }

    .after-card {
      display: grid;
      place-items: center;
      padding: 24px;
      border: 4px solid var(--green);
      background: rgba(71, 121, 106, .10);
      text-align: center;
    }

    .after-card span {
      display: block;
      color: var(--ink-muted);
      font-family: var(--utility);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: .10em;
      text-transform: uppercase;
    }

    .after-card strong {
      display: block;
      margin: 12px 0;
      color: var(--green);
      font-family: var(--display);
      font-size: clamp(64px, 11vw, 126px);
      font-weight: 900;
      line-height: .82;
    }

    .after-card p {
      margin: 0;
      font-size: 16px;
      font-weight: 900;
      line-height: 1.4;
    }

    .prognosis-list {
      display: grid;
      gap: 12px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .prognosis-list li {
      display: grid;
      grid-template-columns: 145px minmax(0, 1fr);
      border: 2px solid var(--line-strong);
      background: rgba(255, 255, 255, .38);
    }

    .prognosis-list b,
    .prognosis-list span {
      min-width: 0;
      padding: 14px;
      line-height: 1.4;
    }

    .prognosis-list b {
      color: #fff;
      background: var(--blue-deep);
    }

    .prognosis-list span {
      font-size: 16px;
      font-weight: 900;
      overflow-wrap: anywhere;
    }

    .disclaimer {
      padding: 18px clamp(20px, 4vw, 42px) 28px;
      color: var(--ink-muted);
      border-top: 1px solid var(--line-strong);
      font-size: 12px;
      line-height: 1.7;
      background: rgba(255, 255, 255, .28);
    }

    @media (prefers-reduced-motion: no-preference) {
      .diagnosis-stamp,
      .chart-card,
      .section {
        animation: rise .7s ease both;
      }

      .chart-card:nth-child(2) { animation-delay: .08s; }
      .chart-card:nth-child(3) { animation-delay: .16s; }
      .section:nth-child(2) { animation-delay: .06s; }
      .section:nth-child(3) { animation-delay: .10s; }
      .section:nth-child(4) { animation-delay: .14s; }
      .section:nth-child(5) { animation-delay: .18s; }
      .section:nth-child(6) { animation-delay: .22s; }

      @keyframes rise {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .diagnosis-stamp {
        animation-name: stamp-in;
        animation-duration: .55s;
      }

      @keyframes stamp-in {
        0% {
          opacity: 0;
          transform: rotate(-7deg) scale(1.08);
        }
        72% {
          opacity: 1;
          transform: rotate(-1.2deg) scale(.985);
        }
        100% {
          opacity: 1;
          transform: rotate(-1.2deg) scale(1);
        }
      }
    }

    @media (max-width: 980px) {
      .hero,
      .memory-grid,
      .diagnostic-grid,
      .prescription-grid,
      .split-diff,
      .treatment-cta,
      .prognosis {
        grid-template-columns: 1fr;
      }

      .hero {
        min-height: 0;
      }

      .form-head {
        grid-template-columns: 86px minmax(0, 1fr);
      }

      .case-meta {
        grid-column: 1 / -1;
      }

      .case-meta {
        width: 100%;
        white-space: normal;
      }

      .case-meta {
        grid-template-columns: 1fr;
      }

      .diff-panel {
        border-right: 0;
        border-bottom: 1px solid var(--line-strong);
      }

      .diff-panel:last-child {
        border-bottom: 0;
      }
    }

    @media (max-width: 700px) {
      .page {
        width: calc(100vw - 18px);
        max-width: 372px;
        margin-left: 9px;
        margin-right: 0;
        padding-top: 10px;
      }

      .medical-folder::after {
        display: none;
      }

      .hero,
      main {
        padding: 16px;
      }

      .diagnosis-stamp {
        transform: none;
        padding: 18px;
      }

      .diagnosis-title {
        font-size: clamp(30px, 8.5vw, 36px);
        line-height: 1.08;
        text-wrap: balance;
        word-break: keep-all;
      }

      .doc-title {
        font-size: clamp(31px, 8.6vw, 38px);
      }

      .score-number {
        font-size: clamp(70px, 25vw, 108px);
      }

      .score-label span:last-child {
        display: none;
      }

      .level-note,
      .mini-row span {
        word-break: break-all;
      }

      .shock-value {
        font-size: clamp(18px, 5.4vw, 24px);
        line-height: 1.08;
      }

      .section-header {
        grid-template-columns: 1fr;
      }

      .shock-strip {
        grid-template-columns: 1fr;
      }

      .form-head {
        grid-template-columns: 62px minmax(0, 1fr);
      }

      .hospital-mark {
        width: 62px;
      }

      .shock-item {
        border-right: 0;
        border-bottom: 1px solid var(--line);
      }

      .shock-item:last-child { border-bottom: 0; }

      .shock-label {
        margin-bottom: 8px;
      }

      .primary-complaint,
      .mini-row,
      .surface-list li,
      .prognosis-list li {
        grid-template-columns: 1fr;
      }

      .section-caption {
        text-align: left;
      }

      .diff-row {
        grid-template-columns: 42px minmax(0, 1fr);
        font-size: 12px;
      }

      .diff-gutter {
        padding: 12px 7px;
      }

      .rx-meta {
        grid-template-columns: 1fr;
      }

      .treatment-link {
        width: 100%;
        white-space: normal;
      }
    }

    @media print {
      html,
      body {
        background: #fff;
      }

      .page {
        width: 100%;
        padding: 0;
      }

      .medical-folder {
        box-shadow: none;
      }
    }
  </style>
</head>
<body>
  <div id="app" class="page"></div>
  <script>
    const LEVELS = [
      { min: 90, max: 100, name: "认知清明（脑回清奇）", code: "CLEAR", className: "clear", guidance: "记忆结构清楚、常驻负担低；保持定期复查即可。" },
      { min: 75, max: 89, name: "轻度信息过载", code: "LOAD", className: "load", guidance: "记忆环境总体可用；优先清理少量断链、矛盾和可外移参考。" },

    const DIMENSION_ORDER = [

    const escapeHTML = (value) => String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");

    const escapeXML = (value) => String(value ?? "")
      .replace(/&/g, "&amp;")

      .replace(/"/g, "&quot;");

    const clampScore = (score) => Math.max(0, Math.min(100, Number(score) || 0));
    const currentLevel = (score) => LEVELS.find((level) => score >= level.min && score <= level.max) || LEVELS[LEVELS.length - 1];
    const scoreTone = (score) => {
      const value = clampScore(score);
      if (value >= 75) return "healthy";
      if (value >= 60) return "caution";
      if (value >= 40) return "warn";
      return "danger";

    function wrapTextForSvg(text, maxChars) {
      const chars = Array.from(String(text || ""));
      const lines = [];
      let line = "";
      chars.forEach((char) => {
        const next = line + char;
        if (next.length > maxChars && line) {
          lines.push(line);
          line = char.trimStart();
        } else {
          line = next;
        }
      });
      if (line) lines.push(line);
      return lines;
    }

    function svgTextLines(text, x, y, options = {}) {
      const size = options.size || 36;
      const lineHeight = options.lineHeight || Math.round(size * 1.25);
      const fill = options.fill || "#18211f";
      const weight = options.weight || 800;
      const family = options.family || `"PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif`;
      const anchor = options.anchor ? ` text-anchor="${options.anchor}"` : "";
      const lines = options.lines || wrapTextForSvg(text, options.maxChars || 18);
      return lines.map((line, index) => `<text x="${x}" y="${y + index * lineHeight}" font-family='${family}' font-size="${size}" font-weight="${weight}" fill="${fill}"${anchor}>${escapeXML(line)}</text>`).join("");
    }

    }

    function pngBlobFromSvg(svg) {
      return new Promise((resolve, reject) => {
        const canvas = document.createElement("canvas");
        canvas.width = 1080;
        canvas.height = 1440;
        const context = canvas.getContext("2d");
        const image = new Image();
        const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml;charset=utf-8" }));
        image.onload = () => {
          context.fillStyle = "#f4f6ed";
          context.fillRect(0, 0, canvas.width, canvas.height);
          context.drawImage(image, 0, 0);
          URL.revokeObjectURL(url);
          canvas.toBlob((blob) => {
            if (blob) resolve(blob);
            else reject(new Error("PNG 生成失败"));
          }, "image/png");
        };
        image.onerror = () => {
          URL.revokeObjectURL(url);
          reject(new Error("SVG 加载失败"));
        };
        image.src = url;
      });
    }

    async function downloadShareCard(data) {
      const status = document.querySelector("[data-share-status]");
      const button = document.querySelector("[data-share]");
      try {
        if (button) button.disabled = true;
        if (status) status.textContent = "正在生成 PNG…";
        const svg = createShareSvg(data);
        const blob = await pngBlobFromSvg(svg);
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = "agent-memory-checkup.png";
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
        if (status) status.textContent = "已生成小红书竖版 PNG";
        return blob;
      } catch (error) {
        if (status) status.textContent = error.message;
        throw error;
      } finally {
        if (button) button.disabled = false;
      }
    }

    window.__diagnosisTestGenerateSharePng = () => pngBlobFromSvg(createShareSvg(DATA));
    document.addEventListener("DOMContentLoaded", () => renderReport(DATA));
  </script>
